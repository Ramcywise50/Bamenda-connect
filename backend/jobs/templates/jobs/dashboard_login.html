<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Bamenda Connect</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: linear-gradient(135deg, #001F5B, #003399); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .brand { font-family: 'Playfair Display', serif; font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem; }
  .brand span { color: #C5A059; }
  .subtitle { text-align: center; color: #777; font-size: 0.9rem; margin-bottom: 2rem; }
  label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.4rem; color: #333; }
  input { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #DEE2E6; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; margin-bottom: 1.25rem; }
  input:focus { border-color: #003399; }
  button { width: 100%; padding: 0.85rem; background: linear-gradient(90deg, #001F5B, #003399); color: #fff; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .error { background: #FFEBEE; color: #C62828; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Bamenda<span>Connect</span></div>
  <p class="subtitle">Admin Dashboard Login</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    {% csrf_token %}
    <label>Username</label>
    <input type="text" name="username" placeholder="Admin username" required>
    <label>Password</label>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login to Dashboard</button>
  </form>
</div>
</body>
</html>
